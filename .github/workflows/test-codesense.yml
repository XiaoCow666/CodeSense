name: Test CodeSense

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "Optional PR number to test its merge ref"
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr != '' && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        env:
          FLASK_CONFIG: testing
          TEST_DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest tests -q
